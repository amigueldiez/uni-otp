<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img class="brand-mark" src="../icons/icon128.png" alt="Uni-OTP">
      <h1>Uni-OTP</h1>
    </div>
    <nav class="tabs" role="tablist">
      <button id="tab-code" class="tab active" role="tab">Código</button>
      <button id="tab-config" class="tab" role="tab">Config</button>
    </nav>
  </header>

  <main>
    <section id="view-code" role="tabpanel">
      <div id="code-card" class="card code-card hidden">
        <div class="code-row">
          <p class="code" id="code"></p>
          <button id="copy-code" class="button-icon small" title="Copiar" aria-label="Copiar código">
            <svg id="copy-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
        </div>
        <div class="code-meta">
          <span id="expires"></span>
          <div class="progress" id="progress"><div class="progress-bar" id="progress-bar"></div></div>
        </div>
      </div>
      <div id="code-empty" class="empty hidden">
        <p>Configura tu token para ver el código.</p>
        <button id="goto-config" class="button-secondary">Ir a Configuración</button>
      </div>
      <button id="refresh-code" class="button-icon hidden" title="Actualizar" aria-label="Actualizar código">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
      </button>
    </section>

    <section id="view-config" class="hidden" role="tabpanel">
      <form class="card form" id="config-form">
        <label for="secret">Secret base32</label>
        <input type="text" id="secret" placeholder="JBSWY3DPEHPK3PXP" autocomplete="off" spellcheck="false">
        <button type="submit" class="button-primary" id="save-config">Guardar</button>
        <p id="config-msg" class="hidden"></p>
      </form>
    </section>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
